name: Release package

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref to package
        required: true
        default: main
      signing_identity:
        description: Developer ID identity name or SHA-1 hash
        required: true
        default: "Developer ID Application"

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.event.inputs.release_ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build signed and notarized DMG
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_ref }}

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun notarytool --version

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          set -Eeuo pipefail

          : "${CERTIFICATE_BASE64:?DEVELOPER_ID_CERTIFICATE_BASE64 is required}"
          : "${CERTIFICATE_PASSWORD:?DEVELOPER_ID_CERTIFICATE_PASSWORD is required}"
          : "${KEYCHAIN_PASSWORD:?RELEASE_KEYCHAIN_PASSWORD is required}"

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/safemac-release.keychain-db"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          {
            echo "RELEASE_KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      - name: Write Notary API key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          set -Eeuo pipefail

          : "${NOTARY_KEY_BASE64:?NOTARY_KEY_BASE64 is required}"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"

          {
            echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple DMG
        env:
          SIGNING_IDENTITY: ${{ github.event.inputs.signing_identity }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_TIMEOUT: 45m
        run: |
          set -Eeuo pipefail

          : "${NOTARY_KEY_ID:?NOTARY_KEY_ID is required}"
          : "${NOTARY_ISSUER_ID:?NOTARY_ISSUER_ID is required}"
          ./scripts/create-dmg.sh

      - name: Verify distribution artifacts
        run: |
          set -Eeuo pipefail

          test -f build/SafeMac-AV.dmg
          test -f build/SHA256SUMS.txt
          (cd build && shasum -a 256 -c SHA256SUMS.txt)
          codesign --verify --strict --verbose=2 build/SafeMac-AV.dmg
          xcrun stapler validate build/SafeMac-AV.dmg
          spctl --assess --type open --verbose build/SafeMac-AV.dmg

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safemac-av-release-package
          path: |
            build/SafeMac-AV.dmg
            build/SHA256SUMS.txt
          if-no-files-found: error

      - name: Delete temporary signing keychain
        if: always()
        run: |
          set -Eeuo pipefail

          if [[ -n "${RELEASE_KEYCHAIN_PATH:-}" && -f "$RELEASE_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN_PATH"
          fi
