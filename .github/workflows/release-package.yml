name: Release package

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable annotated release tag (refs/tags/vX.Y.Z)
        required: true
        default: refs/tags/v1.2.0
      signing_identity:
        description: Developer ID identity name or SHA-1 hash
        required: true
        default: "Developer ID Application"

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.event.inputs.release_ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build signed and notarized DMG
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: release
    timeout-minutes: 60

    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate immutable release tag
        id: validate_release
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -Eeuo pipefail

          fail() {
            printf 'Error: release ref validation failed\n' >&2
            exit 1
          }

          [[ "$GITHUB_REF" == "refs/heads/main" ]] || fail
          [[ "$RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || fail

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" || fail
          git fetch --force --no-tags origin "+$RELEASE_REF:$RELEASE_REF" || fail
          [[ "$(git cat-file -t "$RELEASE_REF" 2>/dev/null)" == "tag" ]] || fail

          release_commit="$(git rev-parse --verify "$RELEASE_REF^{commit}")" || fail
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main || fail
          printf 'release_commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"

      - name: Check out validated release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate_release.outputs.release_commit }}
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun notarytool --version

      - name: Preflight Sparkle release trust
        env:
          SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
          SPARKLE_DOWNLOAD_URL_PREFIX: ${{ vars.SPARKLE_DOWNLOAD_URL_PREFIX }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_ED_KEY_BASE64 }}
        run: |
          set -Eeuo pipefail

          SPARKLE_PRIVATE_ED_KEY="$RUNNER_TEMP/sparkle_private_ed_key"
          ./scripts/prepare-sparkle-release-key.sh "$SPARKLE_PRIVATE_ED_KEY"
          echo "SPARKLE_PRIVATE_ED_KEY=$SPARKLE_PRIVATE_ED_KEY" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077

          : "${CERTIFICATE_BASE64:?DEVELOPER_ID_CERTIFICATE_BASE64 is required}"
          : "${CERTIFICATE_PASSWORD:?DEVELOPER_ID_CERTIFICATE_PASSWORD is required}"
          : "${KEYCHAIN_PASSWORD:?RELEASE_KEYCHAIN_PASSWORD is required}"

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/safemac-release.keychain-db"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          {
            echo "RELEASE_KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      - name: Write Notary API key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          set -Eeuo pipefail
          umask 077

          : "${NOTARY_KEY_BASE64:?NOTARY_KEY_BASE64 is required}"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"

          {
            echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple DMG
        env:
          SIGNING_IDENTITY: ${{ github.event.inputs.signing_identity }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_TIMEOUT: 45m
          SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -Eeuo pipefail

          : "${NOTARY_KEY_ID:?NOTARY_KEY_ID is required}"
          : "${NOTARY_ISSUER_ID:?NOTARY_ISSUER_ID is required}"
          : "${SPARKLE_FEED_URL:?SPARKLE_FEED_URL repository variable is required}"
          : "${SPARKLE_PUBLIC_ED_KEY:?SPARKLE_PUBLIC_ED_KEY repository variable is required}"
          ./scripts/create-dmg.sh

      - name: Generate Sparkle appcast
        env:
          SPARKLE_DOWNLOAD_URL_PREFIX: ${{ vars.SPARKLE_DOWNLOAD_URL_PREFIX }}
        run: |
          set -Eeuo pipefail

          : "${SPARKLE_DOWNLOAD_URL_PREFIX:?SPARKLE_DOWNLOAD_URL_PREFIX repository variable is required}"
          : "${SPARKLE_PRIVATE_ED_KEY:?Sparkle release preflight did not provide a private key}"
          mkdir -p build/appcast
          cp build/SafeMac-AV.dmg build/appcast/
          SPARKLE_PRIVATE_ED_KEY="$SPARKLE_PRIVATE_ED_KEY" \
          SPARKLE_DOWNLOAD_URL_PREFIX="$SPARKLE_DOWNLOAD_URL_PREFIX" \
            ./scripts/generate-appcast.sh build/appcast

      - name: Verify distribution artifacts
        env:
          EXPECTED_SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
          EXPECTED_SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          EXPECTED_SPARKLE_DOWNLOAD_URL_PREFIX: ${{ vars.SPARKLE_DOWNLOAD_URL_PREFIX }}
        run: ./scripts/verify-release-package.sh build

      - name: Remove release credentials before artifact upload
        run: |
          set -Eeuo pipefail

          security delete-keychain "$RUNNER_TEMP/safemac-release.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/sparkle_private_ed_key" \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "SPARKLE_PRIVATE_ED_KEY="
            echo "NOTARY_KEY_PATH="
            echo "RELEASE_KEYCHAIN_PATH="
          } >> "$GITHUB_ENV"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safemac-av-release-package
          path: |
            build/SafeMac-AV.dmg
            build/SHA256SUMS.txt
            build/appcast/appcast.xml
          if-no-files-found: error

      - name: Delete temporary signing keychain
        if: always()
        run: |
          set -Eeuo pipefail

          rm -f \
            "$RUNNER_TEMP/sparkle_private_ed_key" \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/safemac-release.keychain-db" 2>/dev/null || true
