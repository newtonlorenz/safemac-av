name: Publish appcast

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish an appcast for
        required: true
        default: v1.2.0

permissions:
  contents: write

concurrency:
  group: publish-appcast-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish-appcast:
    name: Generate and upload signed Sparkle appcast
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: release
    timeout-minutes: 20

    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release tag
        id: validate_release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail

          fail() {
            printf 'Error: release tag validation failed\n' >&2
            exit 1
          }

          [[ "$GITHUB_REF" == "refs/heads/main" ]] || fail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || fail

          release_ref="refs/tags/$RELEASE_TAG"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" || fail
          git fetch --force --no-tags origin "+$release_ref:$release_ref" || fail
          [[ "$(git cat-file -t "$release_ref" 2>/dev/null)" == "tag" ]] || fail

          main_commit="$(git rev-parse --verify refs/remotes/origin/main^{commit})" || fail
          release_commit="$(git rev-parse --verify "$release_ref^{commit}")" || fail
          [[ "$release_commit" == "$main_commit" ]] || fail

          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download published release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.validate_release.outputs.release_tag }}
        run: |
          set -Eeuo pipefail

          mkdir -p build/appcast
          gh release download "$RELEASE_TAG" \
            --pattern SafeMac-AV.dmg \
            --pattern SHA256SUMS.txt \
            --dir build/appcast

          test -f build/appcast/SafeMac-AV.dmg
          test -f build/appcast/SHA256SUMS.txt
          cd build/appcast
          shasum -a 256 -c SHA256SUMS.txt

      - name: Ensure appcast asset is not already published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.validate_release.outputs.release_tag }}
        run: |
          set -Eeuo pipefail

          if gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name' | grep -Fxq appcast.xml; then
            printf 'Error: appcast.xml is already published for %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Resolve Sparkle appcast tooling
        run: |
          set -Eeuo pipefail

          xcodebuild \
            -resolvePackageDependencies \
            -project ClamAV-GUI.xcodeproj \
            -scheme ClamAV-GUI \
            -derivedDataPath build/DerivedData

      - name: Generate Sparkle appcast
        env:
          SPARKLE_DOWNLOAD_URL_PREFIX: ${{ vars.SPARKLE_DOWNLOAD_URL_PREFIX }}
          SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_ED_KEY_BASE64 }}
        run: |
          set -Eeuo pipefail

          : "${SPARKLE_DOWNLOAD_URL_PREFIX:?SPARKLE_DOWNLOAD_URL_PREFIX repository variable is required}"
          : "${SPARKLE_FEED_URL:?SPARKLE_FEED_URL repository variable is required}"
          : "${SPARKLE_PUBLIC_ED_KEY:?SPARKLE_PUBLIC_ED_KEY repository variable is required}"
          : "${SPARKLE_PRIVATE_ED_KEY_BASE64:?SPARKLE_PRIVATE_ED_KEY_BASE64 is required}"

          sparkle_private_key="$RUNNER_TEMP/sparkle_private_ed_key"
          cleanup_sparkle_key() {
            rm -f "$sparkle_private_key"
          }
          trap cleanup_sparkle_key EXIT

          ./scripts/prepare-sparkle-release-key.sh "$sparkle_private_key"
          unset SPARKLE_PRIVATE_ED_KEY_BASE64

          SPARKLE_PRIVATE_ED_KEY="$sparkle_private_key" \
          SPARKLE_DOWNLOAD_URL_PREFIX="$SPARKLE_DOWNLOAD_URL_PREFIX" \
            ./scripts/generate-appcast.sh build/appcast

      - name: Verify release package
        env:
          EXPECTED_SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
          EXPECTED_SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          EXPECTED_SPARKLE_DOWNLOAD_URL_PREFIX: ${{ vars.SPARKLE_DOWNLOAD_URL_PREFIX }}
        run: |
          set -Eeuo pipefail

          cp build/appcast/SafeMac-AV.dmg build/SafeMac-AV.dmg
          cp build/appcast/SHA256SUMS.txt build/SHA256SUMS.txt
          ./scripts/verify-release-package.sh build

      - name: Upload appcast asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.validate_release.outputs.release_tag }}
        run: |
          set -Eeuo pipefail

          gh release upload "$RELEASE_TAG" build/appcast/appcast.xml
