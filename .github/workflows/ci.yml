name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run unit and integration tests
        run: |
          set -o pipefail
          xcodebuild \
            -project ClamAV-GUI.xcodeproj \
            -scheme ClamAV-GUI \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ClamAV-GUI-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Build Release configuration
        run: |
          set -o pipefail
          xcodebuild \
            -project ClamAV-GUI.xcodeproj \
            -scheme ClamAV-GUI \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ClamAV-GUI-Release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
