name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run release packaging script tests
        run: |
          ./scripts/test-prepare-sparkle-release-key.sh
          ./scripts/test-create-dmg-signing.sh
          ./scripts/test-verify-release-package.sh
          ./scripts/test-installed-sparkle-canary.sh
          ./scripts/test-run-installed-sparkle-canary.sh
          ./scripts/test-xcodebuild-cleanup.sh

      - name: Run unit and integration tests
        run: ./scripts/run-tests.sh unit

      - name: Build Release configuration
        run: ./scripts/run-tests.sh release
